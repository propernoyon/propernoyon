<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420"><style>text{font-family:'Courier New',monospace;font-weight:bold}.h{font-size:20px}.d{font-size:15px;fill:#9ca3af}.n{font-size:16px}.s1,.s2,.s3,.s4{fill:#1e1636}@keyframes hl{0%,100%{fill:#1e1636}25%{fill:#22d3ee}}.s1{animation:hl 4s infinite}.s2{animation:hl 4s infinite 1s}.s3{animation:hl 4s infinite 2s}.s4{animation:hl 4s infinite 3s}@keyframes bar{0%{width:0}80%,100%{width:360px}}.bar{animation:bar 4s linear infinite}@keyframes pu{0%,100%{r:6;opacity:.5}50%{r:10;opacity:1}}.pu{animation:pu 2s ease-in-out infinite}.pu2{animation:pu 2s ease-in-out infinite .6s}.pu3{animation:pu 2s ease-in-out infinite 1.2s}@keyframes b{50%{opacity:0}}.c{animation:b 1s steps(1) infinite}@keyframes ln{0%{opacity:0}20%,100%{opacity:1}}.l1{animation:ln 5s infinite}.l2{animation:ln 5s infinite 1s}.l3{animation:ln 5s infinite 2s}@keyframes fl{to{stroke-dashoffset:-20}}.fl{stroke-dasharray:4 6;animation:fl 1s linear infinite}</style><rect width="1000" height="420" fill="#120d1f"/><g fill="none" stroke-width="3"><rect x="10" y="10" width="480" height="195" stroke="#22d3ee"/><rect x="510" y="10" width="480" height="195" stroke="#4ade80"/><rect x="10" y="215" width="480" height="195" stroke="#f472b6"/><rect x="510" y="215" width="480" height="195" stroke="#f59e0b"/></g><text class="h" x="25" y="40" fill="#22d3ee">01 VIDEO AUTOMATION</text><text class="d" x="25" y="62">script &gt; voice &gt; render &gt; publish</text><g><rect class="s1" x="25" y="85" width="95" height="40" stroke="#22d3ee" stroke-width="2"/><rect class="s2" x="135" y="85" width="95" height="40" stroke="#22d3ee" stroke-width="2"/><rect class="s3" x="245" y="85" width="95" height="40" stroke="#22d3ee" stroke-width="2"/><rect class="s4" x="355" y="85" width="115" height="40" stroke="#22d3ee" stroke-width="2"/></g><g fill="#e5e7eb" class="n"><text x="42" y="111">SCRIPT</text><text x="152" y="111">VOICE</text><text x="258" y="111">RENDER</tex